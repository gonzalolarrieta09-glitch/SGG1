<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <div class="header-actions">
            <button id="themeToggle" class="theme-btn" type="button">🌙 Tema oscuro</button>
        </div>

        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingrese su usuario" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                    <button type="button" class="toggle-password-btn" data-target="password">👁️</button>
                </div>
            </div>

            <button type="submit" id="btnLoginSubmit">Ingresar</button>
        </form>

        <div id="mensajeResultado" class="message"></div>

        <div class="form-links">
            <a href="registro.html">Registrar nueva cuenta</a> | 
            <a href="recuperar.html">Olvidé mi contraseña</a>
        </div>
    </main>
    <script src="login.js"></script>
</body>
</html>
