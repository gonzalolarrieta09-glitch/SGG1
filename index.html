<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <button id="themeToggle" class="theme-btn" type="button">
            🌙 Tema oscuro
        </button>

        <div id="loginSection">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ingrese su usuario" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <div class="form-links">
                <a href="#" id="linkToRegister">Registrar nueva cuenta</a> | 
                <a href="#" id="linkToRecover">Olvidé mi contraseña</a>
            </div>
        </div>

        <div id="registerSection" class="hidden">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regUsername">Usuario</label>
                    <input type="text" id="regUsername" placeholder="Nuevo usuario" required>
                </div>
                <div class="input-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mayús, minús, núm y símbolo" required>
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <div class="form-links">
                <a href="#" class="linkToLogin">Volver al Inicio de Sesión</a>
            </div>
        </div>

        <div id="recoverSection" class="hidden">
            <h2>Recuperar Contraseña</h2>
            <form id="recoverForm">
                <div class="input-group">
                    <label for="recUsername">Usuario</label>
                    <input type="text" id="recUsername" placeholder="Tu usuario registrado" required>
                </div>
                <div class="input-group">
                    <label for="recEmail">Correo Electrónico</label>
                    <input type="email" id="recEmail" placeholder="Tu correo registrado" required>
                </div>
                <div class="input-group">
                    <label for="recPassword">Nueva Contraseña</label>
                    <input type="password" id="recPassword" placeholder="Mayús, minús, núm y símbolo" required>
                </div>
                <button type="submit">Actualizar Contraseña</button>
            </form>
            <div class="form-links">
                <a href="#" class="linkToLogin">Volver al Inicio de Sesión</a>
            </div>
        </div>

        <div id="mensajeResultado" class="message"></div>

    </main>

    <script src="login.js"></script>

</body>
</html>
