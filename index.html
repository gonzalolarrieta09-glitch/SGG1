<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Proyecto</title><link rel="stylesheet" href="style.css">

</head>
<body><main class="login-container">

    <button id="themeToggle" class="theme-btn">
        🌙 Cambiar tema
    </button>

    <h2>Iniciar Sesión</h2>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">Usuario</label>
            <input
                type="text"
                id="username"
                required
                autocomplete="username"
                placeholder="Tu usuario">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
                placeholder="Tu contraseña">
        </div>

        <button type="submit">
            Conectarse
        </button>

    </form>

    <hr>

    <h3>¿No tienes cuenta? Regístrate</h3>

    <form id="registroForm">

        <div class="input-group">
            <label for="nuevoUsuario">Usuario</label>
            <input
                type="text"
                id="nuevoUsuario"
                required
                placeholder="Nuevo usuario">
        </div>

        <div class="input-group">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                required
                placeholder="ejemplo@gmail.com">
        </div>

        <div class="input-group">
            <label for="nuevaPassword">Contraseña</label>
            <input
                type="password"
                id="nuevaPassword"
                required
                placeholder="Nueva contraseña">
        </div>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <div id="mensajeResultado" class="message"></div>

</main>

<script src="login.js"></script>

</body>
</html>
