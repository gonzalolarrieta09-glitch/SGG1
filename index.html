<style>
  .hidden {
    display: none !important;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
  }

  /* --- VARIABLES: TEMA OSCURO (POR DEFECTO) --- */
  :root {
    --bg-body: #0d1117;
    --bg-card: #161b22;
    --border-card: #30363d;
    --text-primary: #f8fafc;
    --text-secondary: #c9d1d9;
    --text-muted: #8b949e;
    --bg-input: #21262d;
    --border-input: #30363d;
    --btn-bg: #2563eb;         /* Azul en modo oscuro */
    --btn-hover: #1d4ed8;
    --link-color: #58a6ff;
  }

  /* --- VARIABLES: TEMA CLARO (AL ACTIVAR .dark-mode EN BODY) --- */
  body.dark-mode {
    --bg-body: #f1f5f9;         /* Gris claro suave */
    --bg-card: #ffffff;         /* Tarjeta blanca */
    --border-card: #e2e8f0;
    --text-primary: #0f172a;    /* Texto oscuro */
    --text-secondary: #334155;
    --text-muted: #64748b;
    --bg-input: #f8fafc;
    --border-input: #cbd5e1;
    --btn-bg: #d97706;         /* Dorado elegante */
    --btn-hover: #b45309;
    --link-color: #d97706;      /* Enlaces dorados */
  }

  /* ESTILOS GENERALES USANDO LAS VARIABLES */
  body {
    background-color: var(--bg-body);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card-container {
    background-color: var(--bg-card);
    width: 100%;
    max-width: 380px;
    padding: 28px 24px;
    border-radius: 16px;
    border: 1px solid var(--border-card);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .theme-toggle-btn {
    background-color: var(--btn-bg);
    color: #ffffff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }

  .theme-toggle-btn:hover {
    background-color: var(--btn-hover);
  }

  h2 {
    text-align: center;
    font-size: 1.4rem;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .form-group input {
    width: 100%;
    background-color: var(--bg-input);
    border: 1px solid var(--border-input);
    color: var(--text-primary);
    padding: 10px 12px;
    border-radius: 8px;
    outline: none;
  }

  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    padding-right: 36px;
  }

  .toggle-password-btn {
    position: absolute;
    right: 10px;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  .btn-primary {
    background-color: var(--btn-bg);
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  .btn-primary:hover {
    background-color: var(--btn-hover);
  }

  .btn-primary:disabled {
    background-color: var(--border-input);
    cursor: not-allowed;
    opacity: 0.6;
  }

  .links-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .links-footer a {
    color: var(--link-color);
    text-decoration: none;
  }

  .links-footer a:hover {
    text-decoration: underline;
  }

  .separator {
    color: var(--border-card);
  }

  .message {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    text-align: center;
  }

  .message.error {
    background-color: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid #ef4444;
  }

  .message.success {
    background-color: rgba(34, 197, 94, 0.15);
    color: #16a34a;
    border: 1px solid #22c55e;
  }

  .req-list {
    list-style: none;
    font-size: 0.78rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .req-valid { color: #16a34a; }
  .req-invalid { color: #dc2626; }
</style>
